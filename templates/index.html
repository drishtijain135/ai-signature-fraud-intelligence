{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class=""container">
 <div class="hero">
    <h1>AI Signature Fraud Detection UI Working!</h1>
    <p>This is my Flask frontend.</p>
 </div>

 <div class="upload-section">
    <form action="/verify" method="POST" enctype="multipart/form-data">

    <label>Reference Signature:</label>
    <input type="file" name="ref" accept="image/*" required>
    <br><br>

    <label>Test Signature:</label>
    <input type="file" name="test" accept="image/*" required>
    <br><br>

    <button type="submit">Verify Signature</button>

    </form>

 </div>
</div>

{% endblock %}
